app = "healthmap-CHANGE-ME"
primary_region = "iad"

[build]

[env]
  DATABASE_PATH = "/data/healthmap.db"
  SESSION_COOKIE_SECURE = "1"

[mounts]
  source = "healthmap_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
